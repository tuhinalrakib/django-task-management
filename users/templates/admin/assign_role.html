{% extends "admin/dashboard.html" %}
{% block content %}
<div>
    <div>
        {% if messages %}
            <ul>
                {% for message in messages %}
                    <li class='bg-green-500 py-2 px-1 text-white'>{{message}}</li>
                {% endfor %}
            </ul>
        {% endif %}
    </div>
    <form action="" method="POST" class="w-1/2 mx-auto my-8">
        {% csrf_token %}
        {{form}}
        <button type="submit" class="mt-3 px-3 py-2 rounded-xl bg-blue-500">Assigned</button>
    </form>
</div>
{% endblock content %}
